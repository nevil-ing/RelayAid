name: Analyze

on:
  push:
    branches: [main, 'chore/**']
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          dart analyze relayaid_client --fatal-infos
          dart analyze relayaid_server --fatal-infos
          (cd relayaid_flutter && flutter analyze --fatal-infos)
